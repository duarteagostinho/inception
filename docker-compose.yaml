services:
  nginx:
    build: ./nginx
    container_name: nginx
    ports:
      - "443:443"
    volumes:
      - wp-data:/var/www/html
    networks:
      - inception
    restart: unless-stopped

volumes:
  wp-data:
    driver: local
    driver_opts:
      type: none
      device: /home/duarteagostinho/data/wordpress
      o: bind

networks:
  inception:
    driver: bridge
