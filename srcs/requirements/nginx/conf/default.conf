server {
    listen 443 ssl;
    server_name duandrad.42.fr;
    ssl_certificate /etc/nginx/ssl/duandrad.42.fr.crt; # path to ssl certificate generated with openssl
    ssl_certificate_key /etc/nginx/ssl/duandrad.42.fr.key; # path to key for certificate generated with openssl
    ssl_protocols TLSv1.2 TLSv1.3; # required by subject
    
    root /var/www/html; # shared volume for nginx and wp, where website files are stored
    index index.php index.html; # nginx looks for .php first, and .html after

    location / {
    	try_files $uri $uri/ /index.php?$args; # for any request, try the first $uri (file), \
    }						             	   # second $uri/ (dirs), else redirect to index.php with args

    location ~ \.php$ { #captures requests ending in .php and passes the to the fpm
		fastcgi_pass wordpress:9000; # sends request to our wp container trough port 9000
		fastcgi_index index.php;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; # tells php which file to execute (/index.php)
		include fastcgi_params; # this is an import for standard values for nginx to run fast_cgi_params
    }
}

