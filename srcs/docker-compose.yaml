services:
  nginx:
    build: ./requirements/nginx
    container_name: nginx
    ports:
      - "443:443"
    volumes:
      - wp-data:/var/www/html
    networks:
      - inception
    restart: unless-stopped

  mariadb:
    build: ./requirements/mariadb
    env_file: ../.env
    container_name: mariadb
    volumes:
     - mariadb-data:/var/lib/mysql
    networks:
     - inception
    restart: unless-stopped

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    env_file: .env
    volumes:
      - wp-data:/var/www/html
    networks:
      - inception
    restart: unless-stopped

volumes:
  wp-data:
    driver: local
    driver_opts:
      type: none
      device: /Users/gloryboyduda/data/wordpress
      o: bind
  mariadb-data:
    driver: local
    driver_opts:
      type: none
      device: /Users/gloryboyduda/data/database
      o: bind

networks:
  inception:
    driver: bridge
